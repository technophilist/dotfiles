# custom keybindings
unbind r 
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# splits use TMUX_PANE_DIR instead of #{pane_current_path} because on macOS,
# #{pane_current_path} resolves to nvim's CWD (the foreground process) rather
# than the shell's CWD. TMUX_PANE_DIR is set explicitly by nvim wrapper functions.
bind '"' split-window -c "#{E:TMUX_PANE_DIR}"
bind % split-window -h -c "#{E:TMUX_PANE_DIR}"

# enable mouse support
set -g mouse on

# vim motions setup 
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
# resizing pane with vim keys
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

set-option -g status-position top

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'

#!/usr/bin/env bash

# (dark2026) Colors for Tmux
# --- DARK 2026 ---
set -g status-style "fg=#3994bc,bg=#121314"
set -g message-style "fg=#bbbebf,bg=#121314"

# Status Left (Session Name)
set -g status-left-length 50
set -g status-left "#[fg=#121314,bg=#3994bc,bold] #S #[fg=#3994bc,bg=#121314,nobold]"

# Windows (Tabs)
setw -g window-status-style "fg=#8c8c8c,bg=#121314"
setw -g window-status-current-format "#[fg=#121314,bg=#4ec9b0,bold] #I  #W #[fg=#4ec9b0,bg=#121314,nobold]"
setw -g window-status-format "#[fg=#121314,bg=#242526]#[fg=#8c8c8c] #I  #W #[fg=#242526,bg=#121314]"

# Status Right (Date/Time)
set -g status-right "#[fg=#242526,bg=#121314]#[fg=#bbbebf,bg=#242526] %Y-%m-%d  %I:%M %p"

# Fix for kiro-cli breaking vim-tmux-navigator.
# kiro-cli wraps the terminal in a pseudo-terminal (PTY), so the default check (ps -t <tty>)
# only sees the pseudo-terminal wrapper process "zsh (kiro-cli-term)" as foreground —
# even when nvim is running inside it. This makes every pane look like vim.
#
# Fix: walk the process tree from #{pane_pid} instead of checking the pseudo-terminal (PTY).
#   pane_pid → child pids (pgrep -P) → grandchild pids → check if any is nvim
# A pane running nvim will have it as a grandchild; a plain zsh pane won't.
set -g @vim_navigator_check "pgrep -P '#{pane_pid}' | xargs -I{} pgrep -P {} | xargs ps -o comm= -p 2>/dev/null | grep -iqE '^(\\S+/)?g?\\.?(view|l?n?vim?x?)(diff)?(-wrapped)?$'"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
